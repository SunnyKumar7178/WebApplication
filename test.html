<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Assessment Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container my-4 p-4 shadow-lg rounded">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h2 class="pt-3"><b>Quiz Assessment</b></h2>
                <p>Question 1 of 10</p>
            </div>
            <div class="col-md-6 text-md-end text-start mt-3 mt-md-0">
                <div class="rounded px-4 py-3 h5 text-danger d-inline-block" id="timer">⏱️15:00</div>
            </div>
        </div>
    </div>

    <div class="container px-5">
        <div class="progress mb-3" style="height: 0.5rem;">
            <div class="progress-bar" role="progressbar" style="width: 10%;" aria-valuenow="10" aria-valuemin="0"
                aria-valuemax="100"></div>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row gy-4">
            <!-- Left Panel: Question Status -->
            <div class="col-lg-4 col-md-5">
                <div class="shadow-lg p-3 rounded">
                    <div class="h4 mb-4">Question Status</div>
                    <div class="row g-2">
                        <!-- Question buttons -->
                        <div class="col-4"><button class="btn btn-outline-dark w-100">1</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">2</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">3</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">4</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">5</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">6</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">7</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">8</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">9</button></div>
                        <div class="col-4"><button class="btn btn-outline-dark w-100">10</button></div>
                    </div>

                    <!-- Status Legend -->
                    <div class="card mt-4 p-3">
                        <div class="mb-2"><span class="status-dot current me-2"></span> Current</div>
                        <div class="mb-2"><span class="status-dot answered me-2"></span> Answered</div>
                        <div class="mb-2"><span class="status-dot not-answered me-2"></span> Not Answered</div>
                        <div class="mb-2"><span class="status-dot touched me-2"></span> Touched</div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Question and Options -->
            <div class="col-lg-8 col-md-7">
                <div class="shadow-lg p-4 rounded">
                    <h4>Q1. What is the capital of France?</h4>
                    <div class="form-check my-3 border border-dark rounded py-3 px-5">
                        <input class="form-check-input" type="radio" name="option" id="option1">
                        <label class="form-check-label" for="option1">London</label>
                    </div>
                    <div class="form-check my-3 border border-dark rounded py-3 px-5">
                        <input class="form-check-input" type="radio" name="option" id="option2">
                        <label class="form-check-label" for="option2">Berlin</label>
                    </div>
                    <div class="form-check my-3 border border-dark rounded py-3 px-5">
                        <input class="form-check-input" type="radio" name="option" id="option3">
                        <label class="form-check-label" for="option3">Paris</label>
                    </div>
                    <div class="form-check my-3 border border-dark rounded py-3 px-5">
                        <input class="form-check-input" type="radio" name="option" id="option4">
                        <label class="form-check-label" for="option4">Madrid</label>
                    </div>

                    <div class="d-flex justify-content-between mt-5">
                        <button class="btn btn-secondary"><b>← Previous</b></button>
                        <button class="btn btn-danger px-4"><b>Submit</b></button>
                        <button class="btn btn-success"><b>Save & Next →</b></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="question.js"></script>
</body>

</html>
