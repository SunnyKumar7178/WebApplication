<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Assessment Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <style>
    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .current {
      background-color: blue;
    }

    .answered {
      background-color: green;
    }

    .not-answered {
      background-color: red;
    }

    .touched {
      background-color: orange;
    }

    @media (max-width: 768px) {
      .questionbtn {
        width: 40px;
        height: 40px;
        padding: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container shadow-sm my-4 py-4 rounded">
    <div class="row align-items-center">
      <div class="col-md-6 col-12 ps-4 text-center text-md-start">
        <h2 class="pt-3"><b>Quiz Assessment</b></h2>
        <p>Question 1 of 10</p>
      </div>
      <div class="col-md-6 col-12 text-center text-md-end">
        <div class="rounded my-3 px-4 py-2 h5 text-danger d-inline-block" id="timer">⏱️15:00</div>
      </div>
    </div>
  </div>

  <div class="mx-3 mx-md-5 progress" style="height: 0.5rem;">
    <div class="progress-bar" role="progressbar" style="width: 10%;" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div>
  </div>

  <div class="container my-4">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 col-12 mb-4 shadow-lg rounded">
        <h4 class="text-center text-md-start mt-3">Question Status</h4>
        <div class="d-flex flex-wrap justify-content-center gap-2 p-2">
          <!-- Question buttons -->
          <button class="btn btn-outline-secondary questionbtn">1</button>
          <button class="btn btn-outline-secondary questionbtn">2</button>
          <button class="btn btn-outline-secondary questionbtn">3</button>
          <button class="btn btn-outline-secondary questionbtn">4</button>
          <button class="btn btn-outline-secondary questionbtn">5</button>
          <button class="btn btn-outline-secondary questionbtn">6</button>
          <button class="btn btn-outline-secondary questionbtn">7</button>
          <button class="btn btn-outline-secondary questionbtn">8</button>
          <button class="btn btn-outline-secondary questionbtn">9</button>
          <button class="btn btn-outline-secondary questionbtn">10</button>
        </div>

        <div class="card p-3 my-3 mx-auto" style="max-width: 280px;">
          <div class="mb-2"><span class="status-dot current"></span>Current</div>
          <div class="mb-2"><span class="status-dot answered"></span>Answered</div>
          <div class="mb-2"><span class="status-dot not-answered"></span>Not Answered</div>
          <div class="mb-2"><span class="status-dot touched"></span>Touched</div>
        </div>
      </div>

      <!-- Main Question Area -->
      <div class="col-md-8 col-12 ms-md-5 shadow-lg rounded">
        <h4 class="ms-3 my-4">Q1. What is the capital of France?</h4>
        <div class="form-check border border-dark rounded shadow-sm py-2 px-3 mx-3 my-2">
          <input class="form-check-input" type="radio" name="option" id="opt1">
          <label class="form-check-label" for="opt1">London</label>
        </div>
        <div class="form-check border border-dark rounded shadow-sm py-2 px-3 mx-3 my-2">
          <input class="form-check-input" type="radio" name="option" id="opt2">
          <label class="form-check-label" for="opt2">Berlin</label>
        </div>
        <div class="form-check border border-dark rounded shadow-sm py-2 px-3 mx-3 my-2">
          <input class="form-check-input" type="radio" name="option" id="opt3">
          <label class="form-check-label" for="opt3">Paris</label>
        </div>
        <div class="form-check border border-dark rounded shadow-sm py-2 px-3 mx-3 my-2">
          <input class="form-check-input" type="radio" name="option" id="opt4">
          <label class="form-check-label" for="opt4">Madrid</label>
        </div>

        <div class="container mb-4 mt-3">
          <div class="row text-center text-md-start">
            <div class="col-12 col-md-4 mb-2"><button class="btn btn-secondary w-100"><b>← Previous</b></button></div>
            <div class="col-12 col-md-4 mb-2"><button class="btn btn-danger w-100"><b>Submit</b></button></div>
            <div class="col-12 col-md-4 mb-2"><button class="btn btn-success w-100"><b>Save & Next →</b></button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="question.js"></script>
</body>

</html>
