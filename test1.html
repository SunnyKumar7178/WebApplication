<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DOB Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h4>Select Your Date of Birth</h4>
        <form>
            <div class="row">
                <!-- Day -->
                <div class="col-md-4 mb-3">
                    <label for="dob-day" class="form-label">Day</label>
                    <select class="form-select" id="dob-day" required>
                        <option value="" selected disabled>Day</option>
                        <!-- Day options will be generated via JS -->
                    </select>
                </div>

                <!-- Month -->
                <div class="col-md-4 mb-3">
                    <label for="dob-month" class="form-label">Month</label>
                    <select class="form-select" id="dob-month" required>
                        <option value="" selected disabled>Month</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>

                <!-- Year -->
                <div class="col-md-4 mb-3">
                    <label for="dob-year" class="form-label">Year</label>
                    <select class="form-select" id="dob-year" required>
                        <option value="" selected disabled>Year</option>
                        <!-- Year options will be generated via JS -->
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script>
        // Generate Day options
        const daySelect = document.getElementById("dob-day");
        for (let d = 1; d <= 31; d++) {
            const option = document.createElement("option");
            option.value = d;
            option.text = d;
            daySelect.appendChild(option);
        }

        // Generate Year options
        const yearSelect = document.getElementById("dob-year");
        const currentYear = new Date().getFullYear();
        for (let y = currentYear; y >= 1900; y--) {
            const option = document.createElement("option");
            option.value = y;
            option.text = y;
            yearSelect.appendChild(option);
        }
    </script>
</body>

</html>
