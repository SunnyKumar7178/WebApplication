<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz assesment page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class=" container shadow-lg  my-4 py-4 rounded">
        <div class="row">
            <div class="col-6 ps-4">
                <h2 class="pt-3"><b>quiz assesment</b></h2>
                <p>question 1 of 10</p>
            </div>
            <div class="container-fluid col-6 d-flex justify-content-end ">
                <div class=" rounded   my-4  px-4 py-3 h4 text-danger me-3" id="timer">⏱️15:00</div>
            </div>
        </div>

    </div>
    <div class="container mx-5 progress " style="height: 0.5rem">
        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
            style="width: 10%"></div>
    </div>
    <div class="container my-3 ">
        <div class="row pt-3 ">
            <div class="col-3 shadow-lg rounded ">
                <div class="h2 mb-4">Question status</div>
                <div class="row d-flex justify-content-center mb-3">
                    <div class="col-4"><button type="button "
                            class="btn btn-outline-light text-center text-dark  questionbtn">01</button></div>
                    <div class="col-4">
                        <button type="button "
                            class="btn btn-outline-light text-center text-dark questionbtn">02</button>
                    </div>
                    <div class="col-4">
                        <button type="button "
                            class="btn btn-outline-light text-center text-dark questionbtn">03</button>
                    </div>


                </div>
                <div class="row d-flex justify-content-center mb-3 ">
                    <div class="col-4"><button type="button "
                            class="btn btn-outline-light text-center text-dark  questionbtn">04</button></div>
                    <div class="col-4">
                        <button type="button "
                            class="btn btn-outline-light text-center text-dark questionbtn">05</button>
                    </div>
                    <div class="col-4">
                        <button type="button "
                            class="btn btn-outline-light text-center text-dark questionbtn">06</button>
                    </div>
                </div>
                <div class="row d-flex justify-content-center mb-3">
                    <div class="col-4"><button type="button "
                            class="btn btn-outline-light text-center text-dark  questionbtn">07</button></div>
                    <div class="col-4">
                        <button type="button "
                            class="btn btn-outline-light text-center text-dark questionbtn">08</button>
                    </div>
                    <div class="col-4">
                        <button type="button "
                            class="btn btn-outline-light text-center text-dark questionbtn">09</button>
                    </div>
                </div>
                <div class="row d-flex pb-2 mb-3">
                    <div class="col-4"><button type="button "
                            class="btn btn-outline-light text-center text-dark  questionbtn">10</button></div>


                </div>
                <div class="card p-3" style="max-width: 300px;">
                    <div class="mb-2">
                        <span class="status-dot current"></span> Current
                    </div>
                    <div class="mb-2">
                        <span class="status-dot answered"></span> Answered
                    </div>
                    <div class="mb-2">
                        <span class="status-dot not-answered"></span> Not Answered
                    </div>
                    <div class="mb-2">
                        <span class="status-dot touched"></span> Touched
                    </div>
                </div>


            </div>
            <div class="  col-8 rounded shadow-lg ms-5 ">
                <h2 class="ms-5 my-5">Q1. what is the capital of france?</h2>
                <div class="container py-2 col-11 me-5 ms-5 mt-3 mb-3 border  border-dark rounded shadow-sm">
                    <input type="radio" name="option" id="1a">
                    <label for="1a">London</label>
                </div>
                <div class="container py-2 col-11 me-5 ms-5 mt-3 mb-3  border border-dark rounded shadow-sm">
                    <input type="radio" name="option" id="1a">
                    <label for="1a">Berlin</label>
                </div>
                <div class="container py-2 col-11 me-5 ms-5 mt-3 mb-3  border border-dark rounded shadow-sm">
                    <input type="radio" name="option" id="1a">
                    <label for="1a">Paris</label>
                </div>
                <div class="container py-2 col-11 me-5 ms-5 mt-3 mb-5  border border-dark rounded shadow-sm">
                    <input type="radio" name="option" id="1a">
                    <label for="1a">Madrid</label>
                </div>
                <div class="container mb-4 ms-5">
                    <div class="row">
                        <div class="col-4"><button class="btn btn-secondary border border-dark "><b>←
                                    previous</b></button></div>
                        <div class="col-4"><button class="btn  btn-danger px-4 "><b>submit</b></button></div>
                        <div class="col-4"><button class="btn  btn-success "><b>Save & Next →</b></button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="question.js"></script>
</body>

</html>
